# سجل مصادر حملة الترجمة -> @DrMalekDrive
# مولَّد آلياً من tg-campaign-toolkit/scripts/tg_forward_to_channel.py v2.1 (أحدث التزام: e8c03d2)
# primary handle = اسم المستخدم الفعلي في تيليجرام؛ mode = نمط السحب:
#   all = كل الرسائل | doc = الوثائق فقط | media = الوسائط فقط
# filtered = true يعني أن السحب يمر عبر matches_filter (مفردات الترجمة) قبل الإرسال.
# القنوات المكتشفة ديناميكياً (fwd_from، hop<=2) تُدار في state/forward/discovered.jsonl
# على جهاز الحملة — لا تُدرج هنا.
