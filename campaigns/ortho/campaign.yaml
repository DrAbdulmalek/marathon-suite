campaign: ortho
title: ماراثون العظام
specialty: orthopedics
target_channel:
  handle: '@ortho_homs'
  title: Orthobooks_Homs
  tme_link: https://t.me/ortho_homs
  audience: 2 subscribers
  role: destination — كل المحتوى المسحوب يُنشر هنا
  last_verified: '2026-10-05'
schedule:
  pull_interval_hours: 6
  first_run_backfill: false
  pull_scope: new_only_since_last_cursor
  dedup_key:
  - norm_file_stem
  - size_bytes
  post_mode: forward_with_attribution
  active_hours: 00:00-24:00
  note: قيم افتراضية قابلة للتعديل من واجهة المستخدم لاحقًا
sources_file: sources.yaml
web_sources_file: web_sources.yaml
executor:
  repo: gdrive-telegram-tools
  path: ortho_harvest.py
  resolver: 'ortho_resolve_sources.py — حل قائمة القنوات وpersist الـaccess_hash في state/ortho_harvest/sources.json على جهاز الحملة'
  dashboard: 'ortho_dashboard.py — لوحة RTL على منفذ 8000 + زر تشغيل جولة + دورية ذاتية عند فتح اللوحة إذا مضى >6 ساعات'
  legacy: 'مسودة tg-campaign-toolkit scripts/ortho/tg_forward_ortho.py (PR #4) بانتظار قرار المالك'
  credentials: .secrets/ عبر متغيرات التشغيل فقط — لا أسرار في المستودع
translation_lane:
  bridge: marathon_suite.bridge.build_translation_plan
  policy: المباراة التامة فقط تُعتمد آليًا؛ غير ذلك needs_human=True
stats:
  telegram_total: 40
  telegram_active: 38
  sub_sources: 10
  excluded: 3
  web_sources: 24
  pending_wiring: 0